name: CI - Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start Selenoid
      run: |
        docker run -d --name selenoid \
          -p 4444:4444 \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v $(pwd)/selenoid:/etc/selenoid:ro \
          aerokube/selenoid

    - name: Wait for Selenoid to be ready
      run: |
        for i in {1..30}; do
          if curl -f http://localhost:4444/status; then
            echo "Selenoid is ready"
            break
          fi
          echo "Waiting for Selenoid... ($i/30)"
          sleep 2
        done

    - name: Build test image
      run: docker build -t sprint9-tests .

    - name: Run tests
      run: |
        docker run --rm \
          --network host \
          -e SELENOID_URI=http://localhost:4444/wd/hub \
          -e BROWSER=chrome \
          -e BROWSER_VERSION=130.0 \
          -v $(pwd)/allure-results:/app/allure-results \
          sprint9-tests

    - name: Upload Allure Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30

    - name: Generate Allure Report
      uses: simple-elf/allure-report-action@master
      if: always()
      with:
        allure_results: allure-results
        allure_report: allure-report
        gh_pages: false

    - name: Upload Allure Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30